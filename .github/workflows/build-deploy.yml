name: Build and Deploy to Minikube

on:
  push:
    branches:
      - main
      - master
      - development

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Check Java
      # ============================================================
      - name: Check Java
        run: java -version


      # ============================================================
      # 3. Build Spring Boot application
      # ============================================================
      - name: Build application
        run: mvn clean package -DskipTests


      # ============================================================
      # 4. Check Minikube
      # ============================================================
      - name: Check Minikube
        run: minikube status


      # ============================================================
      # 5. Configure Docker to use Minikube Docker daemon
      # ============================================================
      - name: Configure Docker for Minikube
        shell: powershell
        run: |
          minikube docker-env --shell powershell | Invoke-Expression

          Write-Host "Docker environment configured for Minikube"

          docker version


      # ============================================================
      # 6. Generate unique image tag
      # ============================================================
      - name: Generate image tag
        shell: powershell
        run: |
          $IMAGE_TAG = "${{ github.sha }}".Substring(0, 7)

          Write-Host "Image tag:"
          Write-Host $IMAGE_TAG

          "IMAGE_TAG=$IMAGE_TAG" >> $env:GITHUB_ENV

          "IMAGE_NAME=user-service:$IMAGE_TAG" >> $env:GITHUB_ENV


      # ============================================================
      # 7. Build Docker image
      # ============================================================
      - name: Build Docker image
        run: |
          docker build -t user-service:$env:IMAGE_TAG .


      # ============================================================
      # 8. Check Docker image
      # ============================================================
      - name: Check Docker image
        run: |
          docker images user-service


      # ============================================================
      # 9. Verify image exists in Minikube
      # ============================================================
      - name: Verify image in Minikube
        shell: powershell
        run: |
          Write-Host "Checking image in Minikube..."

          minikube image ls

          if (!(minikube image ls | Select-String "user-service:$env:IMAGE_TAG")) {
              Write-Host "ERROR: Image not found in Minikube"
              exit 1
          }

          Write-Host "Image found successfully"


      # ============================================================
      # 10. Capture current deployment image
      # ============================================================
      - name: Capture current deployment
        shell: powershell
        run: |

          $deploymentExists = kubectl get deployment user-service --ignore-not-found

          if ([string]::IsNullOrWhiteSpace($deploymentExists)) {

              Write-Host "user-service deployment does not exist."
              Write-Host "This is the first deployment."

              "OLD_IMAGE=" >> $env:GITHUB_ENV
              "FIRST_DEPLOYMENT=true" >> $env:GITHUB_ENV

          }
          else {

              $oldImage = kubectl get deployment user-service `
                -o jsonpath="{.spec.template.spec.containers[0].image}"

              Write-Host "Current image:"
              Write-Host $oldImage

              "OLD_IMAGE=$oldImage" >> $env:GITHUB_ENV
              "FIRST_DEPLOYMENT=false" >> $env:GITHUB_ENV
          }


      # ============================================================
      # 11. Deploy Service
      # ============================================================
      - name: Deploy Service
        run: |
          kubectl apply -f k8s/service.yml


      # ============================================================
      # 12. Prepare Deployment YAML with unique image
      # ============================================================
      - name: Prepare Deployment
        shell: powershell
        run: |

          $deploymentFile = "k8s/deployment.yml"

          $generatedFile = Join-Path $env:RUNNER_TEMP "user-service-deployment.yml"

          Write-Host "Generating deployment manifest..."
          Write-Host "Image: user-service:$env:IMAGE_TAG"

          $content = Get-Content $deploymentFile -Raw

          $content = $content -replace `
            '(?m)^\s*image:\s*user-service:[^\r\n]+$', `
            "          image: user-service:$env:IMAGE_TAG"

          Set-Content `
            -Path $generatedFile `
            -Value $content `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Generated deployment:"
          Get-Content $generatedFile

          "GENERATED_DEPLOYMENT=$generatedFile" >> $env:GITHUB_ENV


      # ============================================================
      # 13. Apply Deployment
      # ============================================================
      - name: Deploy new version
        run: |
          kubectl apply -f "$env:GENERATED_DEPLOYMENT"


      # ============================================================
      # 14. Find new ReplicaSet
      # ============================================================
      - name: Find new ReplicaSet
        shell: powershell
        run: |

          Write-Host "Waiting for new ReplicaSet..."

          $newReplicaSet = $null

          for ($i = 1; $i -le 30; $i++) {

              $rsJson = kubectl get rs `
                -l app=user-service `
                -o json

              $rsData = $rsJson | ConvertFrom-Json

              $candidates = @(
                  $rsData.items |
                  Where-Object {
                      $_.spec.template.spec.containers[0].image `
                      -eq "user-service:$env:IMAGE_TAG"
                  } |
                  Sort-Object {
                      $_.metadata.creationTimestamp
                  } -Descending
              )

              if ($candidates.Count -gt 0) {

                  $newReplicaSet = $candidates[0]

                  Write-Host "New ReplicaSet found:"
                  Write-Host $newReplicaSet.metadata.name

                  break
              }

              Write-Host "New ReplicaSet not created yet..."

              Start-Sleep -Seconds 2
          }

          if ($null -eq $newReplicaSet) {

              Write-Host "ERROR: New ReplicaSet was not created."

              kubectl get deployment user-service
              kubectl get rs -l app=user-service

              exit 1
          }

          $newRsName = $newReplicaSet.metadata.name

          $podHash = $newReplicaSet.metadata.labels.'pod-template-hash'

          Write-Host ""
          Write-Host "New ReplicaSet: $newRsName"
          Write-Host "Pod Template Hash: $podHash"

          "NEW_RS=$newRsName" >> $env:GITHUB_ENV
          "NEW_POD_HASH=$podHash" >> $env:GITHUB_ENV


      # ============================================================
      # 15. Check ONLY the new pod
      # ============================================================
      - name: Validate new pod
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "Checking NEW user-service pod"
          Write-Host "=========================================="

          $newPod = $null

          for ($i = 1; $i -le 60; $i++) {

              $podName = kubectl get pods `
                -l "app=user-service,pod-template-hash=$env:NEW_POD_HASH" `
                -o jsonpath="{.items[0].metadata.name}" 2>$null

              if (![string]::IsNullOrWhiteSpace($podName)) {

                  $newPod = $podName

                  Write-Host "New pod found:"
                  Write-Host $newPod

                  break
              }

              Write-Host "Waiting for new pod..."

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($newPod)) {

              Write-Host "ERROR: New pod was not created."

              kubectl get pods -l app=user-service
              kubectl get rs -l app=user-service

              if ($env:FIRST_DEPLOYMENT -eq "false") {

                  Write-Host "Rolling back..."

                  kubectl rollout undo deployment/user-service
                  kubectl rollout status deployment/user-service --timeout=120s
              }

              exit 1
          }

          Write-Host ""
          Write-Host "Monitoring new pod:"
          Write-Host $newPod
          Write-Host ""

          $success = $false
          $failure = $false

          for ($i = 1; $i -le 60; $i++) {

              $phase = kubectl get pod $newPod `
                -o jsonpath="{.status.phase}" 2>$null

              $ready = kubectl get pod $newPod `
                -o jsonpath="{.status.conditions[?(@.type=='Ready')].status}" 2>$null

              $waitingReason = kubectl get pod $newPod `
                -o jsonpath="{.status.containerStatuses[0].state.waiting.reason}" 2>$null

              Write-Host ""
              Write-Host "Check $i / 60"
              Write-Host "Pod: $newPod"
              Write-Host "Phase: $phase"
              Write-Host "Ready: $ready"
              Write-Host "Waiting reason: $waitingReason"

              # ----------------------------------------------------
              # SUCCESS
              # ----------------------------------------------------

              if ($phase -eq "Running" -and $ready -eq "True") {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host "SUCCESS: NEW POD IS RUNNING AND READY"
                  Write-Host "=========================================="

                  $success = $true

                  break
              }


              # ----------------------------------------------------
              # DEFINITE FAILURE
              # ----------------------------------------------------

              if (
                  $waitingReason -eq "CrashLoopBackOff" -or
                  $waitingReason -eq "ImagePullBackOff" -or
                  $waitingReason -eq "ErrImagePull" -or
                  $waitingReason -eq "CreateContainerError" -or
                  $waitingReason -eq "InvalidImageName"
              ) {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host "ERROR: NEW POD FAILED"
                  Write-Host "=========================================="

                  $failure = $true

                  break
              }


              Start-Sleep -Seconds 2
          }


          # ========================================================
          # New pod failed -> rollback
          # ========================================================

          if (!$success) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "NEW VERSION FAILED"
              Write-Host "=========================================="

              Write-Host ""
              Write-Host "New pod:"
              kubectl get pod $newPod -o wide

              Write-Host ""
              Write-Host "All user-service pods:"
              kubectl get pods -l app=user-service -o wide

              Write-Host ""
              Write-Host "New pod description:"
              kubectl describe pod $newPod

              Write-Host ""
              Write-Host "ReplicaSets:"
              kubectl get rs -l app=user-service

              # ----------------------------------------------------
              # Rollback only if an old version exists
              # ----------------------------------------------------

              if ($env:FIRST_DEPLOYMENT -eq "false") {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host "ROLLING BACK TO PREVIOUS VERSION"
                  Write-Host "=========================================="

                  kubectl rollout undo deployment/user-service

                  if ($LASTEXITCODE -ne 0) {

                      Write-Host "ERROR: Rollback command failed."

                      exit 1
                  }

                  Write-Host ""
                  Write-Host "Waiting for rollback..."

                  kubectl rollout status deployment/user-service --timeout=120s

                  if ($LASTEXITCODE -ne 0) {

                      Write-Host "ERROR: Rollback did not complete successfully."

                      kubectl get pods -l app=user-service -o wide

                      exit 1
                  }

                  Write-Host ""
                  Write-Host "Rollback completed."

                  Write-Host ""
                  Write-Host "Current deployment:"
                  kubectl get deployment user-service

                  Write-Host ""
                  Write-Host "Current pods:"
                  kubectl get pods -l app=user-service -o wide
              }

              exit 1
          }


      # ============================================================
      # 16. Final deployment check
      # ============================================================
      - name: Final deployment check
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL DEPLOYMENT CHECK"
          Write-Host "=========================================="

          kubectl get deployment user-service

          Write-Host ""

          kubectl get pods -l app=user-service -o wide

          Write-Host ""

          kubectl get service user-service

          Write-Host ""

          Write-Host "Current image:"
          kubectl get deployment user-service `
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host ""

          Write-Host ""
          Write-Host "Deployment completed successfully."
