name: Build and Deploy to Minikube

on:
  push:
    branches:
      - main
      - master
      - development

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Check Java
      - name: Check Java
        run: java -version

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn clean package -DskipTests

      # 4. Check Minikube
      - name: Check Minikube
        run: minikube status

      # 5. Use Minikube Docker environment
      - name: Configure Docker for Minikube
        shell: powershell
        run: |
          minikube docker-env --shell powershell | Invoke-Expression

      # 6. Build Docker image inside Minikube
      - name: Build Docker image
        run: |
          docker build -t my-service:latest .

      # 7. Check Docker image
      - name: Check Docker image
        run: |
          docker images my-service

      # 8. Verify image availability in Minikube
      - name: Verify image in Minikube
        shell: powershell
        run: |
          Write-Host "Checking image in Minikube..."
          minikube image ls

          if (!(minikube image ls | Select-String "my-service:latest")) {
              Write-Host "Image not found in Minikube"
              exit 1
          }

          Write-Host "Image found successfully"
      # 9. Deploy application
      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      # 10. Restart deployment
      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/my-service

      # 11. Wait for deployment rollout
      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/my-service --timeout=120s

      # 12. Check pod status
      - name: Verify pods are running
        shell: powershell
        run: |
          Write-Host "Checking my-service pods..."

          kubectl get pods -l app=my-service -o wide

          $pods = kubectl get pods -l app=my-service --no-headers

          if ($pods -match "ContainerCreating|Pending|CrashLoopBackOff|Error|ImagePullBackOff") {
              Write-Host "ERROR: my-service pod is not running correctly."
              kubectl describe pods -l app=my-service
              exit 1
          }

          if (!($pods -match "1/1.*Running")) {
              Write-Host "ERROR: my-service pod is not Ready."
              kubectl describe pods -l app=my-service
              exit 1
          }

          Write-Host "SUCCESS: my-service pod is Running and Ready."

      # 13. Check deployment and service
      - name: Final deployment check
        run: |
          kubectl get deployment my-service
          kubectl get pods -l app=my-service
          kubectl get service my-service
