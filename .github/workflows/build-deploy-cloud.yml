name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - development

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Check OCIR token (from GitHub Secrets)
      # ============================================================
      - name: Check OCIR token
        shell: powershell
        run: |
          # Reads OCIR_AUTH_TOKEN from GitHub Repository Secrets.
          # .Trim() is critical — hidden whitespace from copy-paste causes "unauthorized" errors.
          $token = "${{ secrets.OCIR_AUTH_TOKEN }}".Trim()

          if ([string]::IsNullOrWhiteSpace($token)) {
              Write-Host "ERROR: OCIR_AUTH_TOKEN secret is NOT set in GitHub Repository Secrets."
              Write-Host "Go to: Repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
              Write-Host "Name: OCIR_AUTH_TOKEN  |  Value: your OCI Auth Token"
              exit 1
          }

          Write-Host "OCIR_AUTH_TOKEN secret is set in GitHub Secrets"
          Write-Host "Token length : $($token.Length)"
          Write-Host "Token prefix : $($token.Substring(0, [Math]::Min(4, $token.Length)))****"


      # ============================================================
      # 3. Build Spring Boot application
      # ============================================================
      - name: Build application
        run: mvn clean package -DskipTests


      # ============================================================
      # 4. Generate unique image tag
      # ============================================================
      - name: Generate unique image tag
        shell: powershell
        run: |
          $IMAGE_TAG = "${{ github.sha }}".Substring(0, 7)

          $IMAGE_NAME = "hyd.ocir.io/ax9deyw9wgup/ayatullamiddya99/student-service:$IMAGE_TAG"

          Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_TAG=$IMAGE_TAG"
          Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_NAME=$IMAGE_NAME"

          Write-Host "IMAGE_TAG: $IMAGE_TAG"
          Write-Host "IMAGE_NAME: $IMAGE_NAME"


      # ============================================================
      # 5. Logout from OCIR
      # ============================================================
      - name: Logout from OCIR
        shell: powershell
        run: |
          docker logout hyd.ocir.io
          Write-Host "Logged out from OCIR (or was not logged in)"


      # ============================================================
      # 6. Test network connectivity to OCIR
      # ============================================================
      - name: Test OCIR connectivity
        shell: powershell
        run: |
          Write-Host "Testing HTTPS connectivity to hyd.ocir.io..."
          try {
            $response = Invoke-WebRequest -Uri "https://hyd.ocir.io/v2/" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            Write-Host "HTTP Status: $($response.StatusCode)"
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -eq 401) {
              Write-Host "HTTP Status: 401 (Unauthorized) - Expected. Registry is reachable!"
            } else {
              Write-Host "Unexpected error: $($_.Exception.Message)"
              Write-Host "Status code: $statusCode"
              Write-Host "ERROR: Cannot reach hyd.ocir.io. Check network/firewall."
              exit 1
            }
          }
          Write-Host "Network connectivity to OCIR: OK"


      # ============================================================
      # 7. Login to OCIR
      # ============================================================
      - name: Login to OCIR
        shell: powershell
        run: |
          # Read token from GitHub Secrets and trim whitespace.
          # .Trim() is critical — prevents "unauthorized" caused by hidden newlines/spaces.
          $token = "${{ secrets.OCIR_AUTH_TOKEN }}".Trim()

          Write-Host "Token length : $($token.Length)"
          Write-Host "Token prefix : $($token.Substring(0, [Math]::Min(4, $token.Length)))****"

          # Using --password flag directly (avoids stdin pipe issues on Windows)
          # Attempt 1: direct OCI user format
          Write-Host ""
          Write-Host "Attempt 1: direct OCI user (--password flag)..."
          docker login hyd.ocir.io `
            --username "ax9deyw9wgup/ayatullamiddya99@gmail.com" `
            --password "$token"

          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS with direct OCI user format!"
            exit 0
          }

          # Attempt 2: IDCS federated user format
          Write-Host ""
          Write-Host "Attempt 2: IDCS federated user (--password flag)..."
          docker login hyd.ocir.io `
            --username "ax9deyw9wgup/oracleidentitycloudservice/ayatullamiddya99@gmail.com" `
            --password "$token"

          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS with IDCS federated user format!"
            exit 0
          }

          Write-Host ""
          Write-Host "ERROR: Both login attempts failed."
          Write-Host "Regenerate Auth Token in OCI Console: Profile -> My Profile -> Auth Tokens"
          exit 1



      # ============================================================
      # 7. Build Docker image
      # ============================================================
      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t "$env:IMAGE_NAME" .


      # ============================================================
      # 8. Push Docker image to OCIR
      # ============================================================
      - name: Push Docker image
        shell: powershell
        run: |
          docker push "$env:IMAGE_NAME"


      # ============================================================
      # 9. Prepare Deployment YAML
      # ============================================================
      - name: Prepare Deployment
        shell: powershell
        run: |
          $deploymentFile = "k8s/deployment.yml"
          $generatedFile = Join-Path $env:RUNNER_TEMP "user-service-deployment.yml"

          $content = Get-Content $deploymentFile -Raw

          $content = $content -replace 'image:\s*.*', "image: $env:IMAGE_NAME"

          Set-Content `
            -Path $generatedFile `
            -Value $content `
            -Encoding UTF8

          "GENERATED_DEPLOYMENT=$generatedFile" >> $env:GITHUB_ENV

          Write-Host "Generated deployment file:"
          Get-Content $generatedFile


      # ============================================================
      # 10. Apply Deployment
      # ============================================================
      - name: Deploy new version
        shell: powershell
        run: |
          kubectl apply -f "$env:GENERATED_DEPLOYMENT"


      # ============================================================
      # 11. Deploy Service
      # ============================================================
      - name: Deploy Service
        shell: powershell
        run: |
          kubectl apply -f k8s/service.yml


      # ============================================================
      # 12. Deploy Ingress
      # ============================================================
      - name: Deploy Ingress
        shell: powershell
        run: |
          kubectl apply -f k8s/ingress.yml


      # ============================================================
      # 13. Final deployment check
      # ============================================================
      - name: Final deployment check
        shell: powershell
        run: |
          kubectl get deployment user-service
          kubectl get pods -l app=user-service -o wide
          kubectl get service user-service
          kubectl get ingress user-service-ingress
