spring.application.name=student-service
server.port=${port:8087}

my.app=hello
spring.r2dbc.url=r2dbc:h2:mem:///studentdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.r2dbc.username=sa
spring.r2dbc.password=

# This is the important part for Flyway:
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.cloud.config.enabled=false

